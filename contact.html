<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thiết lập bảng mã để hiển thị tiếng Việt -->
    <meta charset="UTF-8">

    <!-- Tiêu đề hiển thị trên tab trình duyệt -->
    <title>Liên hệ – Tuấn Real Estate</title>

    <!-- Kết nối file CSS chính -->
    <link rel="stylesheet" href="style.css">

    <!-- Thư viện icon Facebook & TikTok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Thanh trên cùng của trang -->
<header class="top">
    <!-- Logo hoặc tên công ty -->
    <div class="logo">Đinh Tuấn Real Estate</div>
</header>

<!-- Phần banner ảnh lớn phía trên -->
<section class="contact-hero">
    <!-- Tiêu đề chính -->
    <h1>Liên hệ với Tuấn</h1>

    <!-- Mô tả ngắn -->
    <p>Tư vấn mua nhà – thuê nhà tại nhật</p>
</section>

<!-- Khu vực nội dung chính -->
<section class="contact-page">

    <!-- Khung trắng ở giữa trang -->
    <div class="contact-box">

        <!-- Ảnh nhà minh họa -->
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" />

        <!-- Tiêu đề trong khung -->
        <h2>Nhắn tin cho Tuấn</h2>

        <!-- Nhóm các nút liên hệ -->
        <div class="contact-buttons">

            <!-- Nút Facebook -->
            <a class="fb"
               href="https://www.facebook.com/dinhtuantahahomes"
               target="_blank">
                <i class="fab fa-facebook"></i> Facebook
            </a>

            <!-- Nút TikTok -->
            <a class="tt"
               href="https://www.tiktok.com/@tuandinhtahahomes"
               target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>

        </div>
    </div>

</section>

</body>
</html>
